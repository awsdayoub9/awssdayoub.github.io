<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&family=IBM+Plex+Sans+Arabic:wght@400;600&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body { inline-size: 1200px; block-size: 630px; background: #F6F5F1; color: #1A1F26; font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; overflow: hidden; }
  .frame { position: absolute; inset: 48px; border: 1px solid #D9D6CE; }
  .mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; color: #5A6371; }
  .index { position: absolute; inset-block-start: 76px; inset-inline-start: 84px; }
  .name { position: absolute; inset-block-start: 176px; inset-inline-start: 84px; inset-inline-end: 84px; font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; font-size: 72px; line-height: 1.1; letter-spacing: -.01em; margin: 0; }
  .line { position: absolute; inset-block-start: 284px; inset-inline-start: 84px; inset-inline-end: 84px; font-size: 32px; line-height: 1.35; max-inline-size: 26ch; margin: 0; color: #1A1F26; }
  .eyebrow { position: absolute; inset-block-end: 82px; inset-inline-start: 84px; }
  .dot { display: inline-block; inline-size: 12px; block-size: 12px; border-radius: 50%; background: #0E5C58; margin-inline-end: 12px; vertical-align: middle; }
  .url { position: absolute; inset-block-end: 82px; inset-inline-end: 84px; text-transform: none; letter-spacing: 0; color: #0E5C58; }
  html[lang="ar"] body { font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; }
  html[lang="ar"] .mono { font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; text-transform: none; letter-spacing: 0; font-weight: 600; }
  html[lang="ar"] .name { font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; font-weight: 600; letter-spacing: 0; line-height: 1.3; inset-block-start: 160px; }
  html[lang="ar"] .line { line-height: 1.6; inset-block-start: 284px; }
  html[lang="ar"] .url { font-family: 'IBM Plex Mono', Consolas, monospace; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="mono index" id="index"></div>
  <h1 class="name" id="name"></h1>
  <p class="line" id="line"></p>
  <div class="mono eyebrow" id="eyebrow"><span class="dot"></span><span id="eyebrow-text"></span></div>
  <div class="mono url" id="url"></div>
</body>
</html>
